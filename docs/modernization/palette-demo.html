<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gourmet palettes</title>
<style>
  :root { --ink:#2b1d14; --paper:#fffdf7; --line:#e6dccb; --muted:#7a6a5a; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; color:var(--ink); background:var(--paper); }
  main { max-width:56rem; margin:0 auto; padding:1.5rem 1rem 4rem; }
  h1 { margin:0 0 .25rem; font-family:Georgia,serif; }
  p.lead { margin:0 0 1rem; color:var(--muted); }
  .try { position:sticky; top:0; background:var(--paper); padding:.75rem 0; border-bottom:1px solid var(--line); z-index:2; }
  .try input { width:100%; box-sizing:border-box; font:inherit; font-size:1.1rem; padding:.55rem .75rem; border:2px solid var(--line); border-radius:.5rem; }
  .result { display:flex; align-items:center; gap:.75rem; margin-top:.6rem; min-height:3rem; }
  .chip { display:inline-flex; align-items:center; padding:.45rem .9rem; border-radius:.6rem; font-family:Georgia,serif; font-weight:600; }
  .row { display:grid; grid-template-columns:2rem 5rem 1fr auto auto; gap:.75rem; align-items:center; padding:.4rem .25rem; border-bottom:1px solid var(--line); }
  .row.hit { outline:3px solid var(--ink); outline-offset:-2px; border-radius:.4rem; background:#fff7dc; }
  .row.out { opacity:.4; }
  .n { color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .sw { height:2.4rem; border-radius:.45rem; display:grid; place-items:center; font:700 1rem Georgia,serif; }
  code { font:13px ui-monospace,monospace; word-break:break-word; }
  .c { font-size:12px; color:var(--muted); white-space:nowrap; }
  .c.low { color:#b3261e; font-weight:600; }
  .ing { font-size:11px; padding:.1rem .4rem; border-radius:1rem; background:#efe6d3; color:var(--muted); white-space:nowrap; }
  .row:not(:has(.ing)) .c { grid-column:5; }
  .tier { margin:1.2rem 0 .2rem; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
</style>
<main>
  <h1>Recipe palettes</h1>
  <p class="lead">A recipe is checked against the rules top to bottom, first on its title, then on its categories, then (only the rules marked + ingredients) on its ingredients. The first hit wins. Type below to try a title or a category; the ingredients step isn't simulated here.</p>
  <div class="try">
    <input id="q" placeholder="Try a title or category: &quot;Moroccan Chickpea Stew&quot;" autofocus>
    <div class="result" id="result"></div>
  </div>
  <div id="rows"></div>
</main>

\brolls?\\b","flags":"i","bg":"#eed9a0","fg":"#4c2307","contrast":9.7,"ing":false},{"src":"dessert","flags":"i","bg":"#FF3366","fg":"#ffdede","contrast":2.8,"ing":false},{"src":"salad","flags":"i","bg":"#bdeabd","fg":"#133f13","contrast":9,"ing":false},{"src":"greek|greece|mediterr","flags":"i","bg":"#0154C7","fg":"#ebf1ff","contrast":6,"ing":false},{"src":"pasta|italy|italian","flags":"i","bg":"#ce2b37","fg":"#fedeed","contrast":4.2,"ing":false},{"src":"india","flags":"i","bg":"#FEB200","fg":"black","contrast":11.6,"ing":false},{"src":"thai","flags":"i","bg":"#fff194","fg":"#db5800","contrast":3.4,"ing":false},{"src":"china|chinese|asian","flags":"i","bg":"#c51015","fg":"#F8D803","contrast":4.3,"ing":false},{"src":"french|france","flags":"i","bg":"#456990","fg":"#ffc501","contrast":3.6,"ing":false},{"src":"mexic","flags":"i","bg":"#006847","fg":"#fdf1e0","contrast":6.1,"ing":false},{"src":"spanish|spain","flags":"i","bg":"#FED76A","fg":"#6A1410","contrast":8.8,"ing":false},{"src":"vietnam|\\bpho\\b|b[aá]nh|lemongrass","flags":"i","bg":"#587a12","fg":"#f6ffd9","contrast":4.8,"ing":false},{"src":"moroccan|tagine|african|ethiopia|berbere","flags":"i","bg":"#b5451b","fg":"#fff1de","contrast":4.9,"ing":false},{"src":"lebanes|middle eastern|turkish|israel|tabbouleh|shawarma|persian","flags":"i","bg":"#1f6f6b","fg":"#e6fffb","contrast":5.7,"ing":false},{"src":"cuban|venezuel|peru|brazil|colombia|cachapa|arroz|latin|caribbean","flags":"i","bg":"#ff7f50","fg":"#3b0d00","contrast":6.8,"ing":false},{"src":"japan|ramen|udon|sushi|miso|teriyaki|tempura|\\bsoba\\b","flags":"i","bg":"#bc002d","fg":"#ffffff","contrast":6.6,"ing":false},{"src":"korea|noodle","flags":"i","bg":"#1c1c1c","fg":"#ff5a5f","contrast":5.6,"ing":false},{"src":"swed|scandinav|norweg|danish|german|\\bpolish\\b|pepparkakor","flags":"i","bg":"#00508a","fg":"#fecc02","contrast":5.5,"ing":false},{"src":"curry|masala|tikka|korma|biryani|vindaloo|karahi|\\bdal\\b","flags":"i","bg":"#1a1a1a","fg":"#ffc61a","contrast":11.1,"ing":false},{"src":"soup|stew|chowder|bisque","flags":"i","bg":"#a24936","fg":"#ffe8d9","contrast":5,"ing":false},{"src":"\\bpies?\\b|galette|\\btarts?\\b|pastry|crust","flags":"i","bg":"#e8b86d","fg":"#5a1f00","contrast":7.1,"ing":false},{"src":"\\bcakes?\\b|cupcake|muffin|scone","flags":"i","bg":"#c9b8f0","fg":"#2d1a5c","contrast":8.2,"ing":false},{"src":"breakfast|pancake|waffle|crepe|\\beggs?\\b|\\boats?\\b|frittata|quiche","flags":"i","bg":"#ffe5b4","fg":"#7a2e00","contrast":7.7,"ing":false},{"src":"beef|steak|\\bribs?\\b|brisket|lamb|pork|sausage|bacon|\\bham\\b|roast","flags":"i","bg":"#7b1e2b","fg":"#ffe3d6","contrast":8.3,"ing":false},{"src":"chicken|turkey|poultry","flags":"i","bg":"#fbe8c3","fg":"#7a3e00","contrast":6.9,"ing":false},{"src":"cheese|queso|feta|pecorino|parmesan|mozzarella","flags":"i","bg":"#f5b83d","fg":"#3a2200","contrast":8.4,"ing":false},{"src":"yogurt|cream|dairy","flags":"i","bg":"#eef2f7","fg":"#25405f","contrast":9.4,"ing":false},{"src":"pilaf|bulgur|quinoa|\\brice\\b|couscous|grain|risotto","flags":"i","bg":"#f0dc9c","fg":"#4a3a10","contrast":8.1,"ing":false},{"src":"winter|\\bsnow|\\bfrost(?!ing)","flags":"i","bg":"#a8c5da","fg":"#0f2a3f","contrast":8.2,"ing":false}].map((r) => ({ ...r, re: new RegExp(r.src, r.flags) }));
const el = document.getElementById("rows");
rows.forEach((r, i) => {
  const d = document.createElement("div"); d.className = "row"; r.el = d;
  d.innerHTML = '<span class="n">' + (i + 1) + '</span><div class="sw" style="background:' + r.bg + ';color:' + r.fg + '">Aa</div><code>/' + r.src.replace(/</g, "&lt;") + '/' + r.flags + '</code>' + (r.ing ? '<span class="ing" title="also tried against the ingredients, as a last resort">+ ingredients</span>' : '') + '<span class="c' + (r.contrast < 4.5 ? " low" : "") + '" title="text contrast (below 4.5 is flagged)">' + r.contrast + ':1</span>';
  el.append(d);
});
const q = document.getElementById("q"), out = document.getElementById("result");
function run() {
  const t = q.value.trim();
  rows.forEach((r) => r.el.classList.remove("hit", "out"));
  if (!t) { out.innerHTML = ""; return; }
  const win = rows.find((r) => r.re.test(t));
  rows.forEach((r) => { if (r !== win) r.el.classList.add("out"); });
  if (win) { win.el.classList.add("hit"); win.el.scrollIntoView({ block: "center", behavior: "smooth" });
    out.innerHTML = '<span class="chip" style="background:' + win.bg + ';color:' + win.fg + '"></span> <span>matches rule #' + (rows.indexOf(win) + 1) + '</span>';
    out.firstChild.textContent = t; }
  else out.innerHTML = '<span class="chip" style="background:#7a4443;color:#fff0a3"></span> <span>no rule: the plain brown</span>', out.firstChild.textContent = t;
}
q.addEventListener("input", run);
