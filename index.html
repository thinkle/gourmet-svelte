<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The scheme the app follows by default, so the canvas is right before
       the stylesheet arrives. src/theme/scheme.css says the rest. -->
  <meta name="color-scheme" content="light dark">
  <title>Gourmet Recipe Manager</title>
  <script>
    // master and dev share this file: mark every host except production.
    if (!/(^|\.)gourmetrecipemanager\.com$/.test(location.hostname) || location.hostname.indexOf('dev.') === 0) {
      document.title = '(DEV) ' + document.title;
    }
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
