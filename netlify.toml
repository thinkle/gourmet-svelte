[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # The MongoDB driver loads optional native modules at run time; ship it as it is.
  external_node_modules = ["mongodb"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
