openapi: 3.1.0
info:
  title: Gourmet Recipe API
  version: 1.0.0
  description: |
    Manage a personal Gourmet recipe database. Authenticate with Bearer token.
    Minimal recipes can use simple arrays of ingredient strings and instruction
    strings; the API will normalize them.
servers:
  - url: "https://dev--gourmet-svelte.netlify.app"
security:
  - BearerAuth: []
paths:
  /.netlify/functions/api/authcheck:
    post:
      summary: Auth debug info
      operationId: authCheck
      description: Returns whether auth headers were received (no secrets).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auth header diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: object
                    properties:
                      hasAuthorization:
                        type: boolean
                      hasApiKey:
                        type: boolean
                      scheme:
                        type: string
                        nullable: true
                      tokenLength:
                        type: integer
  /.netlify/functions/api/recipes:
    post:
      summary: Create a recipe
      operationId: createRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: The created recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/query:
    post:
      summary: List recipes
      operationId: listRecipes
      description: Search recipes by text or category.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
  /.netlify/functions/api/recipes/summary/query:
    post:
      summary: List recipe summaries
      operationId: listRecipeSummaries
      description: Lightweight list optimized for quick lookups.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipe summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSummaryListResponse"
  /.netlify/functions/api/recipes/get:
    post:
      summary: Get a recipe by id
      operationId: getRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/update:
    post:
      summary: Update a recipe by id
      operationId: updateRecipe
      description: Partial updates are merged into the stored recipe.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdateRequest"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/delete:
    post:
      summary: Delete a recipe by id
      operationId: deleteRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                type: integer
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    RecipeQuery:
      type: object
      properties:
        search:
          type: string
        category:
          type: string
        limit:
          type: integer
          default: 50
        page:
          type: integer
          default: 0
    RecipeIdRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    RecipeUpdateRequest:
      type: object
      required:
        - id
        - recipe
      properties:
        id:
          type: string
        recipe:
          $ref: "#/components/schemas/RecipeInput"
    RecipeSummaryListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
    RecipeListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
    RecipeSummary:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        rating:
          type: number
        last_modified:
          type: number
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        owner:
          type: object
          properties:
            email:
              type: string
            full_name:
              type: string
    RecipeInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        ingredients:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Ingredient"
        instructions:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        text:
          type: array
          description: Rich text blocks; body can be plain text or HTML.
          items:
            $ref: "#/components/schemas/TextBlock"
        categories:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Category"
        sources:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Source"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        rating:
          type: number
          minimum: 0
          maximum: 5
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          properties:
            _id:
              type: string
            owner:
              type: object
              properties:
                email:
                  type: string
                full_name:
                  type: string
    Ingredient:
      type: object
      properties:
        text:
          type: string
        ingkey:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
    Amount:
      type: object
      properties:
        amount:
          type: number
        unit:
          type: string
    TextBlock:
      type: object
      properties:
        header:
          type: string
        body:
          type: string
    Category:
      type: object
      properties:
        name:
          type: string
    Source:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
    Yield:
      type: object
      properties:
        amount:
          type: number
        unit:
          type: string
    Time:
      type: object
      properties:
        name:
          type: string
        seconds:
          type: number
        text:
          type: string
    Image:
      type: object
      properties:
        url:
          type: string
        caption:
          type: string
        width:
          type: number
