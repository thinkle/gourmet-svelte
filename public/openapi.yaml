openapi: 3.1.0
info:
  title: Gourmet Recipe API
  version: 1.0.0
  description: |
    Manage a personal Gourmet recipe database. Authenticate with Bearer token.

    Ingredients: send `{amount, unit, ingredient}` when you know the parts
    (e.g. `{"amount": 1.5, "unit": "cups", "ingredient": "flour, sifted"}`).
    If all you have is a line of text ("1 1/2 cups flour, sifted"), send the
    plain string and the server parses the amount and unit out of it. Groups
    are `{"text": "FOR THE DOUGH:", "ingredients": [...]}`.

    Updates are partial at the *field* level: fields you omit keep their stored
    value, and fields you send replace what is stored. Sending `ingredients`
    replaces the whole list -- it is not merged with the old one -- so to add a
    single ingredient, GET the recipe first and send the full new list. Send
    each ingredient back as GET returned it (with its `altAmounts`, `shopItem`
    and `originalText`), or send a changed line as a plain string such as
    "butter (2 sticks)" for the server to parse: an ingredient object sent
    without its `altAmounts` loses them.

    Recipe text: sending `instructions` on an update REPLACES ALL stored text
    blocks with one block (or one per array entry). To keep several blocks,
    GET the recipe, edit its `text` array and send it back whole as
    `text: [{"header": "Dough", "body": "..."}, ...]`. See TextBlock for the
    body format, the HTML subset and scalable `<amount>` markup.

    GET /recipes/schema returns this in machine-readable form.

    Shopping: GET /shopping-list first for the merged list and exact item keys.
    Use the shopping commands to change this list without replacing its stored
    recipe document. Removing an item hides all its contributions from this
    list only; source recipes stay unchanged. Categorization accepts multiple
    keys in one call; category null restores the app's automatic suggestion.
    Shopping reads use recipes:read and shopping writes use recipes:write.
    Mutations are online commands; a browser sees them on its next recipe sync
    (or live-shopping poll). Do not resend an add blindly after an uncertain
    network result: repeated recipe adds intentionally sum their multipliers.
servers:
  - url: "https://dev--gourmet-svelte.netlify.app"
security:
  - BearerAuth: []
paths:
  /.netlify/functions/api/authcheck:
    post:
      summary: Auth debug info
      operationId: authCheck
      description: Returns whether auth headers were received (no secrets).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auth header diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: object
                    properties:
                      hasAuthorization:
                        type: boolean
                      hasApiKey:
                        type: boolean
                      scheme:
                        type: string
                        nullable: true
                      tokenLength:
                        type: integer
  /.netlify/functions/api/recipes:
    post:
      summary: Create a recipe
      operationId: createRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: The created recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/query:
    post:
      summary: List recipes
      operationId: listRecipes
      description: Search recipes by text or category.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
  /.netlify/functions/api/recipes/summary/query:
    post:
      summary: List recipe summaries
      operationId: listRecipeSummaries
      description: Lightweight list optimized for quick lookups.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipe summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSummaryListResponse"
  /.netlify/functions/api/recipes/schema:
    get:
      summary: Describe the shapes this API expects
      operationId: getRecipeSchema
      description: |
        Returns the accepted ingredient shapes, the canonical stored shape, and
        the update semantics. Ask here rather than guessing.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A description of the recipe input shapes.
          content:
            application/json:
              schema:
                type: object
  /.netlify/functions/api/recipes/get:
    post:
      summary: Get a recipe by id
      operationId: getRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/update:
    post:
      summary: Update a recipe by id
      operationId: updateRecipe
      description: |
        Partial at the field level: fields you omit keep their stored value.
        Fields you send replace what is stored -- in particular, `ingredients`,
        `categories` and `sources` replace the entire list rather than being
        merged into it. Read the recipe first if you mean to append.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdateRequest"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/reparse-ingredients:
    post:
      summary: Re-parse ingredients stored as unparsed text (maintenance)
      operationId: reparseRecipeIngredients
      description: |
        Maintenance pass for recipes saved before the API parsed ingredients
        server-side, which stored a whole line in the name field with no
        amount. Repairs what it can and skips anything ambiguous. Does not
        change last_modified. Dry run unless `dryRun` is false; works in
        batches, so page with `offset` until the reply says `done`.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: true
                  description: Report without writing. Defaults to true.
                limit:
                  type: integer
                  default: 25
                  description: Recipes per batch (max 100).
                offset:
                  type: integer
                  default: 0
      responses:
        "200":
          description: What changed, or would change, in this batch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun:
                    type: boolean
                  total:
                    type: integer
                  scanned:
                    type: integer
                  nextOffset:
                    type: integer
                  done:
                    type: boolean
                  recipesChanged:
                    type: integer
                  ingredientsChanged:
                    type: integer
                  stillUnparsedCount:
                    type: integer
                  recipes:
                    type: array
                    items:
                      type: object
  /.netlify/functions/api/recipes/delete:
    post:
      summary: Delete a recipe by id
      operationId: deleteRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                type: integer
  /.netlify/functions/api/shopping-list:
    get:
      summary: Read the merged shopping list
      operationId: getShoppingList
      description: |
        Returns the app's item keys, merged amounts, recipe sources, cart/pantry
        states and aisle choices. With no listId, selects the active list with
        most entries, then newest last_modified, matching the app. An account
        with no list returns listId null and empty recipes/items; GET never
        creates a list. Requires recipes:read.
      parameters:
        - name: listId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ShoppingListResult"
        default:
          $ref: "#/components/responses/ShoppingError"
  /.netlify/functions/api/shopping-list/items/add:
    post:
      summary: Add a loose shopping item
      operationId: addShoppingItem
      description: |
        Parses a whole ingredient line such as "2 lb onions" and appends a loose
        entry. Restores a previously excluded item with the same canonical key.
        Creates a missing default list. Requires recipes:write. Each call adds
        a new entry; read the list before retrying an uncertain network result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingItemAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/ShoppingListResult"
        default:
          $ref: "#/components/responses/ShoppingError"
  /.netlify/functions/api/shopping-list/recipes/add:
    post:
      summary: Add a recipe to the shopping list
      operationId: addRecipeToShoppingList
      description: |
        Adds an account-owned recipe reference at multiplier (default 1).
        If already on the list, multipliers add, as in the app. The source
        recipe is unchanged. Creates a missing default list. Requires
        recipes:write. Read before retrying an uncertain network result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingRecipeAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/ShoppingListResult"
        default:
          $ref: "#/components/responses/ShoppingError"
  /.netlify/functions/api/shopping-list/items/remove:
    post:
      summary: Remove a merged item from this shopping list
      operationId: removeShoppingItem
      description: |
        Use an exact key from GET /shopping-list. Removes matching loose entries
        and excludes recipe-derived contributions on this list. Never changes
        a source recipe or marks the item as pantry. A later loose add with
        the same key restores it. Requires recipes:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingItemRemoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/ShoppingListResult"
        default:
          $ref: "#/components/responses/ShoppingError"
  /.netlify/functions/api/shopping-list/recipes/remove:
    post:
      summary: Remove a recipe from the shopping list
      operationId: removeRecipeFromShoppingList
      description: |
        Removes the recipe reference and its contribution to merged items.
        Keeps loose entries and the source recipe. Requires recipes:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingRecipeRemoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/ShoppingListResult"
        default:
          $ref: "#/components/responses/ShoppingError"
  /.netlify/functions/api/shopping-list/items/categorize:
    post:
      summary: Categorize one or more shopping items
      operationId: categorizeShoppingItems
      description: |
        Assigns an aisle/category to exact keys returned by GET /shopping-list.
        All keys must exist; otherwise no assignments are saved. Category null
        clears explicit assignments and restores automatic suggestions.
        Stored assignments persist on this list for future uses of the item.
        Requires recipes:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingItemsCategorizeRequest"
      responses:
        "200":
          $ref: "#/components/responses/ShoppingListResult"
        default:
          $ref: "#/components/responses/ShoppingError"
components:
  responses:
    ShoppingListResult:
      description: Current merged shopping list. No images or internal live-sync metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ShoppingListResponse"
    ShoppingError:
      description: |
        JSON error. 400 invalid input; 401 unauthorized; 403 insufficient scope;
        404 list, source recipe or item key not found; 405 unsupported method;
        409 concurrent edits exhausted retries; 500 temporarily unavailable.
        Failed input validation never changes the shopping list.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    ShoppingListTarget:
      type: object
      properties:
        listId:
          type: string
          maxLength: 200
          description: Optional exact list _id; omit to use the app's default selection.
    ShoppingItemAddRequest:
      allOf:
        - $ref: "#/components/schemas/ShoppingListTarget"
        - type: object
          required: [text]
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 2000
              examples: ["2 lb onions"]
    ShoppingRecipeRemoveRequest:
      allOf:
        - $ref: "#/components/schemas/ShoppingListTarget"
        - type: object
          required: [recipeId]
          properties:
            recipeId:
              type: string
              minLength: 1
              maxLength: 200
    ShoppingRecipeAddRequest:
      allOf:
        - $ref: "#/components/schemas/ShoppingRecipeRemoveRequest"
        - type: object
          properties:
            multiplier:
              type: number
              exclusiveMinimum: 0
              maximum: 10000
              default: 1
    ShoppingItemRemoveRequest:
      allOf:
        - $ref: "#/components/schemas/ShoppingListTarget"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              minLength: 1
              maxLength: 500
              description: Exact canonical key from getShoppingList; never guess a plural or alias.
    ShoppingItemsCategorizeRequest:
      allOf:
        - $ref: "#/components/schemas/ShoppingListTarget"
        - type: object
          required: [keys, category]
          properties:
            keys:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: string
                minLength: 1
                maxLength: 500
            category:
              type: [string, "null"]
              minLength: 1
              maxLength: 100
              description: A default or custom aisle name; null restores automatic suggestions.
    ShoppingListResponse:
      type: object
      required: [listId, recipes, items, categories, excludedItems]
      properties:
        listId:
          type: [string, "null"]
        recipes:
          type: array
          items:
            type: object
            required: [recipeId, title, multiplier, found]
            properties:
              recipeId:
                type: string
              title:
                type: string
              multiplier:
                type: number
              found:
                type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingItem"
        categories:
          type: array
          description: All shipped aisles plus custom aisles already assigned or ordered on this list, including when the list is empty. Custom category names are also accepted.
          items:
            type: string
        excludedItems:
          type: array
          description: Keys hidden from this list only, without changing source recipes or pantry settings.
          items:
            type: string
    ShoppingItem:
      type: object
      required: [key, name, amounts, category, categorySource, state, sources, looseIds]
      properties:
        key:
          type: string
        name:
          type: string
        amounts:
          type: array
          description: Aggregated, scaled amounts in the same readable units as the app.
          items:
            allOf:
              - $ref: "#/components/schemas/Amount"
              - type: object
                properties:
                  text:
                    type: string
        category:
          type: [string, "null"]
        categorySource:
          type: string
          enum: [assigned, suggested, none]
        state:
          type: string
          enum: [buy, cart, have]
        sources:
          type: array
          items:
            type: object
            properties:
              recipeId:
                type: [string, "null"]
              title:
                type: [string, "null"]
              mult:
                type: number
              text:
                type: string
        looseIds:
          type: array
          items:
            type: integer
    RecipeQuery:
      type: object
      properties:
        search:
          type: string
        category:
          type: string
        limit:
          type: integer
          default: 50
        page:
          type: integer
          default: 0
    RecipeIdRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    RecipeUpdateRequest:
      type: object
      required:
        - id
        - recipe
      properties:
        id:
          type: string
        recipe:
          $ref: "#/components/schemas/RecipePartial"
    RecipeSummaryListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
    RecipeListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
    RecipeSummary:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        rating:
          type: number
        last_modified:
          type: number
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        owner:
          type: object
          properties:
            email:
              type: string
            full_name:
              type: string
    RecipeInput:
      allOf:
        - $ref: "#/components/schemas/RecipePartial"
        - type: object
          required:
            - title
    RecipePartial:
      type: object
      description: |
        Any subset of a recipe's fields. Every field you send replaces the
        stored value for that field; arrays are replaced wholesale, not merged.
      properties:
        title:
          type: string
        ingredients:
          type: array
          description: |
            Each entry is an ingredient, a group, or a plain string. Prefer
            {amount, unit, ingredient} when you know the parts; send a plain
            string when you only have a line of text and the server will parse
            it. Groups keep their nested list as a real sub-list.
          items:
            $ref: "#/components/schemas/IngredientInput"
        instructions:
          description: |
            Shorthand for `text`. A string is stored as one block headed
            "Instructions"; an array as one block per string. On update this
            REPLACES ALL stored text blocks -- send `text` instead to keep
            several blocks. Ignored when `text` is also sent.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        text:
          type: array
          description: |
            The recipe text as blocks, each with its own header ("Dough",
            "Filling"). This is the stored shape GET returns; send the whole
            array back to change one block without collapsing the others.
          items:
            $ref: "#/components/schemas/TextBlock"
        categories:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Category"
        sources:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Source"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        rating:
          type: number
          minimum: 0
          maximum: 5
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          properties:
            _id:
              type: string
            owner:
              type: object
              properties:
                email:
                  type: string
                full_name:
                  type: string
    IngredientInput:
      oneOf:
        - type: string
          description: A whole ingredient line, e.g. "1 1/2 cups flour, sifted".
        - $ref: "#/components/schemas/StructuredIngredient"
        - $ref: "#/components/schemas/IngredientGroup"
    LinkedRecipeIngredient:
      type: object
      description: |
        Another recipe as an ingredient. Search or GET the target first and use
        its exact _id in reference. text is a display label, not a lookup key.
        amount.amount is a batch multiplier (1 = the whole target recipe,
        0.5 = half), not a number of servings or a weight/volume conversion.
        Omit amount for one batch. Shopping expands nested references and skips
        circular edges. A name, URL or ID in instructions does not create a link.
        On update, GET first and resend the entire ingredients array, preserving
        reference on existing links. MCP tools must accept ingredient objects;
        tools limited to string arrays cannot create these links.
      required: [text, reference]
      properties:
        text:
          type: string
        reference:
          type: string
          description: Exact target recipe _id from the API, never a browser-local id.
        amount:
          $ref: "#/components/schemas/Amount"
      example:
        text: Apple filling
        reference: recipe-id-from-search
        amount: {amount: 1}
    StructuredIngredient:
      type: object
      description: |
        The preferred shape. `ingredient` is the name and prep only -- keep the
        amount and unit out of it.
      properties:
        reference:
          type: string
          description: Linked recipe _id. See LinkedRecipeIngredient for batch semantics and examples.
        text:
          type: string
          description: Canonical ingredient label; also accepted instead of ingredient.
        ingredient:
          type: string
          description: Ingredient name and prep, e.g. "flour, sifted".
        amount:
          description: |
            A number, or a string we can parse ("1 1/2", "2-3", "two"). Omit for
            ingredients with no amount ("salt to taste").
          oneOf:
            - type: number
            - type: string
            - $ref: "#/components/schemas/Amount"
        unit:
          type: string
          description: e.g. "cups", "tbsp", "cloves".
        rangeAmount:
          type: number
          description: The other end of a range, if you would rather not write "2-3".
        altAmounts:
          $ref: "#/components/schemas/AltAmountsInput"
        shopItem:
          type: string
          description: |
            Optional. The bare item for a shopping list ("eggs" for "large
            eggs, beaten"). Omit it and the server fills it from the text. A
            shopItem you send is stored as is, so drop it (or send a new one)
            when you change an ingredient's text.
    AltAmountsInput:
      type: array
      description: |
        Optional. Further measures of the same quantity, e.g. `amount: 2,
        unit: "sticks"` with `altAmounts: [{"amount": 225, "unit": "g"}]`, which
        is shown as "2 sticks (225 g) butter". Each entry is an object like
        `amount` or a string like "225 g". Sending `[]` means "no further
        measures" and stops the server looking for one in the text.

        If you do not send it, the server looks for one in the ingredient text
        and, when a parenthetical (or a part after a slash) is a plain number
        and a mass, volume or stick unit, moves it here and out of the text:
        `{"amount": 285, "unit": "g", "ingredient": "butter (2 1/2 sticks)"}`
        is stored as text "butter" with altAmounts [2 1/2 sticks]. Anything
        else in parentheses ("(optional)", "(about 3 lemons)", "(14 oz can)")
        stays in the text. When the server moves one out, the original text is
        kept in `originalText`.
      items:
        oneOf:
          - type: string
          - $ref: "#/components/schemas/Amount"
    IngredientGroup:
      type: object
      description: A heading with its own sub-list, kept as a real sub-list.
      required:
        - ingredients
      properties:
        text:
          type: string
          description: The group heading, e.g. "FOR THE DOUGH:".
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientInput"
    Ingredient:
      type: object
      description: The canonical stored shape, as returned by GET requests.
      properties:
        reference:
          type: string
          description: Optional target recipe _id; amount.amount is a batch multiplier. Preserve on update.
        text:
          type: string
          description: The ingredient name only, with amount and unit removed.
        ingkey:
          type: string
          description: |
            Older ingredients only: the bare item as the desktop app stored
            it. Same meaning as shopItem.
        shopItem:
          type: string
          description: |
            The bare item, lower case ("eggs", "butter", "diced tomatoes"):
            what a shopping list shows and merges on. Filled by the server on
            API writes when the client sent neither shopItem nor ingkey; older
            ingredients may have none.
        amount:
          $ref: "#/components/schemas/Amount"
        altAmounts:
          type: array
          description: |
            Present only when the ingredient has further measures of the same
            quantity. Each is shaped like `amount`; `amount` stays the primary.
          items:
            $ref: "#/components/schemas/Amount"
        originalText:
          type: string
          description: The line as first written, when the server parsed it.
        ingredients:
          type: array
          description: Present only on groups.
          items:
            $ref: "#/components/schemas/Ingredient"
    Amount:
      type: object
      properties:
        amount:
          type: number
          description: The upper bound when the ingredient is a range.
        rangeAmount:
          type: number
          description: The lower bound of a range; absent otherwise.
        unit:
          type: string
        standardUnit:
          type: string
          description: Our normalized unit, when we recognize it.
    TextBlock:
      type: object
      properties:
        header:
          type: string
          description: The block heading, e.g. "Instructions", "Dough". May be empty.
        body:
          type: string
          description: |
            Plain text or HTML, stored exactly as sent.

            Plain text: a blank line starts a new paragraph; lines starting
            "1." or "-" become a list; a short first line ending in ":" becomes
            a subheading.

            HTML: the app shows only these tags (others are removed and their
            text kept): p br h2 h3 h4 h5 h6 ol ul li b strong i em u a
            blockquote hr sub sup small span div table thead tbody tr th td img
            amount. Attributes kept: href title src alt colspan rowspan (no
            class, style, on* or data-*).

            Scalable amounts: wrap an ingredient quantity in `<amount>...</amount>`
            and the app multiplies it when the reader scales the recipe:
            `Beat in <amount>2</amount> eggs, then <amount>1 1/2 cups</amount>
            milk. Bake for 20 minutes.` reads "Beat in 4 eggs, then 3 cups milk.
            Bake for 20 minutes." at x2; the unwrapped 20 minutes never scales.
            Inside the tag: a number, fraction, mixed number or range ("2",
            "1/2", "1 1/2", "2-3", "2 to 3"), optionally followed by its unit
            ("200 g", "1 cup"). No attributes. Works in plain-text bodies too.
            Wrap only ingredient quantities, never times, temperatures, pan
            sizes or step numbers. Clients that do not know the tag show its
            text unchanged.
    Category:
      type: object
      properties:
        name:
          type: string
    Source:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
    Yield:
      type: object
      properties:
        amount:
          type: number
        unit:
          type: string
    Time:
      type: object
      properties:
        name:
          type: string
        seconds:
          type: number
        text:
          type: string
    Image:
      type: object
      properties:
        url:
          type: string
        caption:
          type: string
        width:
          type: number
