openapi: 3.1.0
info:
  title: Gourmet Recipe API
  version: 1.0.0
  description: |
    Manage a personal Gourmet recipe database. Authenticate with Bearer token.

    Ingredients: send `{amount, unit, ingredient}` when you know the parts
    (e.g. `{"amount": 1.5, "unit": "cups", "ingredient": "flour, sifted"}`).
    If all you have is a line of text ("1 1/2 cups flour, sifted"), send the
    plain string and the server parses the amount and unit out of it. Groups
    are `{"text": "FOR THE DOUGH:", "ingredients": [...]}`.

    Updates are partial at the *field* level: fields you omit keep their stored
    value, and fields you send replace what is stored. Sending `ingredients`
    replaces the whole list -- it is not merged with the old one -- so to add a
    single ingredient, GET the recipe first and send the full new list.

    GET /recipes/schema returns this in machine-readable form.
servers:
  - url: "https://dev--gourmet-svelte.netlify.app"
security:
  - BearerAuth: []
paths:
  /.netlify/functions/api/authcheck:
    post:
      summary: Auth debug info
      operationId: authCheck
      description: Returns whether auth headers were received (no secrets).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auth header diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: object
                    properties:
                      hasAuthorization:
                        type: boolean
                      hasApiKey:
                        type: boolean
                      scheme:
                        type: string
                        nullable: true
                      tokenLength:
                        type: integer
  /.netlify/functions/api/recipes:
    post:
      summary: Create a recipe
      operationId: createRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: The created recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/query:
    post:
      summary: List recipes
      operationId: listRecipes
      description: Search recipes by text or category.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
  /.netlify/functions/api/recipes/summary/query:
    post:
      summary: List recipe summaries
      operationId: listRecipeSummaries
      description: Lightweight list optimized for quick lookups.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipe summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSummaryListResponse"
  /.netlify/functions/api/recipes/schema:
    get:
      summary: Describe the shapes this API expects
      operationId: getRecipeSchema
      description: |
        Returns the accepted ingredient shapes, the canonical stored shape, and
        the update semantics. Ask here rather than guessing.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A description of the recipe input shapes.
          content:
            application/json:
              schema:
                type: object
  /.netlify/functions/api/recipes/get:
    post:
      summary: Get a recipe by id
      operationId: getRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/update:
    post:
      summary: Update a recipe by id
      operationId: updateRecipe
      description: |
        Partial at the field level: fields you omit keep their stored value.
        Fields you send replace what is stored -- in particular, `ingredients`,
        `categories` and `sources` replace the entire list rather than being
        merged into it. Read the recipe first if you mean to append.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdateRequest"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/reparse-ingredients:
    post:
      summary: Re-parse ingredients stored as unparsed text (maintenance)
      operationId: reparseRecipeIngredients
      description: |
        Maintenance pass for recipes saved before the API parsed ingredients
        server-side, which stored a whole line in the name field with no
        amount. Repairs what it can and skips anything ambiguous. Does not
        change last_modified. Dry run unless `dryRun` is false; works in
        batches, so page with `offset` until the reply says `done`.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: true
                  description: Report without writing. Defaults to true.
                limit:
                  type: integer
                  default: 25
                  description: Recipes per batch (max 100).
                offset:
                  type: integer
                  default: 0
      responses:
        "200":
          description: What changed, or would change, in this batch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun:
                    type: boolean
                  total:
                    type: integer
                  scanned:
                    type: integer
                  nextOffset:
                    type: integer
                  done:
                    type: boolean
                  recipesChanged:
                    type: integer
                  ingredientsChanged:
                    type: integer
                  stillUnparsedCount:
                    type: integer
                  recipes:
                    type: array
                    items:
                      type: object
  /.netlify/functions/api/recipes/delete:
    post:
      summary: Delete a recipe by id
      operationId: deleteRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                type: integer
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    RecipeQuery:
      type: object
      properties:
        search:
          type: string
        category:
          type: string
        limit:
          type: integer
          default: 50
        page:
          type: integer
          default: 0
    RecipeIdRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    RecipeUpdateRequest:
      type: object
      required:
        - id
        - recipe
      properties:
        id:
          type: string
        recipe:
          $ref: "#/components/schemas/RecipePartial"
    RecipeSummaryListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
    RecipeListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
    RecipeSummary:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        rating:
          type: number
        last_modified:
          type: number
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        owner:
          type: object
          properties:
            email:
              type: string
            full_name:
              type: string
    RecipeInput:
      allOf:
        - $ref: "#/components/schemas/RecipePartial"
        - type: object
          required:
            - title
    RecipePartial:
      type: object
      description: |
        Any subset of a recipe's fields. Every field you send replaces the
        stored value for that field; arrays are replaced wholesale, not merged.
      properties:
        title:
          type: string
        ingredients:
          type: array
          description: |
            Each entry is an ingredient, a group, or a plain string. Prefer
            {amount, unit, ingredient} when you know the parts; send a plain
            string when you only have a line of text and the server will parse
            it. Groups keep their nested list as a real sub-list.
          items:
            $ref: "#/components/schemas/IngredientInput"
        instructions:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        text:
          type: array
          description: Rich text blocks; body can be plain text or HTML.
          items:
            $ref: "#/components/schemas/TextBlock"
        categories:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Category"
        sources:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Source"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        rating:
          type: number
          minimum: 0
          maximum: 5
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          properties:
            _id:
              type: string
            owner:
              type: object
              properties:
                email:
                  type: string
                full_name:
                  type: string
    IngredientInput:
      oneOf:
        - type: string
          description: A whole ingredient line, e.g. "1 1/2 cups flour, sifted".
        - $ref: "#/components/schemas/StructuredIngredient"
        - $ref: "#/components/schemas/IngredientGroup"
    StructuredIngredient:
      type: object
      description: |
        The preferred shape. `ingredient` is the name and prep only -- keep the
        amount and unit out of it.
      properties:
        ingredient:
          type: string
          description: Ingredient name and prep, e.g. "flour, sifted".
        amount:
          description: |
            A number, or a string we can parse ("1 1/2", "2-3", "two"). Omit for
            ingredients with no amount ("salt to taste").
          oneOf:
            - type: number
            - type: string
        unit:
          type: string
          description: e.g. "cups", "tbsp", "cloves".
        rangeAmount:
          type: number
          description: The other end of a range, if you would rather not write "2-3".
    IngredientGroup:
      type: object
      description: A heading with its own sub-list, kept as a real sub-list.
      required:
        - ingredients
      properties:
        text:
          type: string
          description: The group heading, e.g. "FOR THE DOUGH:".
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientInput"
    Ingredient:
      type: object
      description: The canonical stored shape, as returned by GET requests.
      properties:
        text:
          type: string
          description: The ingredient name only, with amount and unit removed.
        ingkey:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        ingredients:
          type: array
          description: Present only on groups.
          items:
            $ref: "#/components/schemas/Ingredient"
    Amount:
      type: object
      properties:
        amount:
          type: number
          description: The upper bound when the ingredient is a range.
        rangeAmount:
          type: number
          description: The lower bound of a range; absent otherwise.
        unit:
          type: string
        standardUnit:
          type: string
          description: Our normalized unit, when we recognize it.
    TextBlock:
      type: object
      properties:
        header:
          type: string
        body:
          type: string
    Category:
      type: object
      properties:
        name:
          type: string
    Source:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
    Yield:
      type: object
      properties:
        amount:
          type: number
        unit:
          type: string
    Time:
      type: object
      properties:
        name:
          type: string
        seconds:
          type: number
        text:
          type: string
    Image:
      type: object
      properties:
        url:
          type: string
        caption:
          type: string
        width:
          type: number
