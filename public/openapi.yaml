openapi: 3.1.0
info:
  title: Gourmet Recipe API
  version: 1.0.0
  description: |
    Manage a personal Gourmet recipe database. Authenticate with Bearer token.

    Ingredients: send `{amount, unit, ingredient}` when you know the parts
    (e.g. `{"amount": 1.5, "unit": "cups", "ingredient": "flour, sifted"}`).
    If all you have is a line of text ("1 1/2 cups flour, sifted"), send the
    plain string and the server parses the amount and unit out of it. Groups
    are `{"text": "FOR THE DOUGH:", "ingredients": [...]}`.

    Updates are partial at the *field* level: fields you omit keep their stored
    value, and fields you send replace what is stored. Sending `ingredients`
    replaces the whole list -- it is not merged with the old one -- so to add a
    single ingredient, GET the recipe first and send the full new list. Send
    each ingredient back as GET returned it (with its `altAmounts`, `shopItem`
    and `originalText`), or send a changed line as a plain string such as
    "butter (2 sticks)" for the server to parse: an ingredient object sent
    without its `altAmounts` loses them.

    Recipe text: sending `instructions` on an update REPLACES ALL stored text
    blocks with one block (or one per array entry). To keep several blocks,
    GET the recipe, edit its `text` array and send it back whole as
    `text: [{"header": "Dough", "body": "..."}, ...]`. See TextBlock for the
    body format, the HTML subset and scalable `<amount>` markup.

    GET /recipes/schema returns this in machine-readable form.
servers:
  - url: "https://dev--gourmet-svelte.netlify.app"
security:
  - BearerAuth: []
paths:
  /.netlify/functions/api/authcheck:
    post:
      summary: Auth debug info
      operationId: authCheck
      description: Returns whether auth headers were received (no secrets).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auth header diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: object
                    properties:
                      hasAuthorization:
                        type: boolean
                      hasApiKey:
                        type: boolean
                      scheme:
                        type: string
                        nullable: true
                      tokenLength:
                        type: integer
  /.netlify/functions/api/recipes:
    post:
      summary: Create a recipe
      operationId: createRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: The created recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/query:
    post:
      summary: List recipes
      operationId: listRecipes
      description: Search recipes by text or category.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
  /.netlify/functions/api/recipes/summary/query:
    post:
      summary: List recipe summaries
      operationId: listRecipeSummaries
      description: Lightweight list optimized for quick lookups.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeQuery"
      responses:
        "200":
          description: A page of recipe summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSummaryListResponse"
  /.netlify/functions/api/recipes/schema:
    get:
      summary: Describe the shapes this API expects
      operationId: getRecipeSchema
      description: |
        Returns the accepted ingredient shapes, the canonical stored shape, and
        the update semantics. Ask here rather than guessing.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A description of the recipe input shapes.
          content:
            application/json:
              schema:
                type: object
  /.netlify/functions/api/recipes/get:
    post:
      summary: Get a recipe by id
      operationId: getRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/update:
    post:
      summary: Update a recipe by id
      operationId: updateRecipe
      description: |
        Partial at the field level: fields you omit keep their stored value.
        Fields you send replace what is stored -- in particular, `ingredients`,
        `categories` and `sources` replace the entire list rather than being
        merged into it. Read the recipe first if you mean to append.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdateRequest"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /.netlify/functions/api/recipes/reparse-ingredients:
    post:
      summary: Re-parse ingredients stored as unparsed text (maintenance)
      operationId: reparseRecipeIngredients
      description: |
        Maintenance pass for recipes saved before the API parsed ingredients
        server-side, which stored a whole line in the name field with no
        amount. Repairs what it can and skips anything ambiguous. Does not
        change last_modified. Dry run unless `dryRun` is false; works in
        batches, so page with `offset` until the reply says `done`.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: true
                  description: Report without writing. Defaults to true.
                limit:
                  type: integer
                  default: 25
                  description: Recipes per batch (max 100).
                offset:
                  type: integer
                  default: 0
      responses:
        "200":
          description: What changed, or would change, in this batch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun:
                    type: boolean
                  total:
                    type: integer
                  scanned:
                    type: integer
                  nextOffset:
                    type: integer
                  done:
                    type: boolean
                  recipesChanged:
                    type: integer
                  ingredientsChanged:
                    type: integer
                  stillUnparsedCount:
                    type: integer
                  recipes:
                    type: array
                    items:
                      type: object
  /.netlify/functions/api/recipes/delete:
    post:
      summary: Delete a recipe by id
      operationId: deleteRecipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeIdRequest"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                type: integer
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    RecipeQuery:
      type: object
      properties:
        search:
          type: string
        category:
          type: string
        limit:
          type: integer
          default: 50
        page:
          type: integer
          default: 0
    RecipeIdRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    RecipeUpdateRequest:
      type: object
      required:
        - id
        - recipe
      properties:
        id:
          type: string
        recipe:
          $ref: "#/components/schemas/RecipePartial"
    RecipeSummaryListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
    RecipeListResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        result:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
    RecipeSummary:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        rating:
          type: number
        last_modified:
          type: number
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        owner:
          type: object
          properties:
            email:
              type: string
            full_name:
              type: string
    RecipeInput:
      allOf:
        - $ref: "#/components/schemas/RecipePartial"
        - type: object
          required:
            - title
    RecipePartial:
      type: object
      description: |
        Any subset of a recipe's fields. Every field you send replaces the
        stored value for that field; arrays are replaced wholesale, not merged.
      properties:
        title:
          type: string
        ingredients:
          type: array
          description: |
            Each entry is an ingredient, a group, or a plain string. Prefer
            {amount, unit, ingredient} when you know the parts; send a plain
            string when you only have a line of text and the server will parse
            it. Groups keep their nested list as a real sub-list.
          items:
            $ref: "#/components/schemas/IngredientInput"
        instructions:
          description: |
            Shorthand for `text`. A string is stored as one block headed
            "Instructions"; an array as one block per string. On update this
            REPLACES ALL stored text blocks -- send `text` instead to keep
            several blocks. Ignored when `text` is also sent.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        text:
          type: array
          description: |
            The recipe text as blocks, each with its own header ("Dough",
            "Filling"). This is the stored shape GET returns; send the whole
            array back to change one block without collapsing the others.
          items:
            $ref: "#/components/schemas/TextBlock"
        categories:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Category"
        sources:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: "#/components/schemas/Source"
        yields:
          type: array
          items:
            $ref: "#/components/schemas/Yield"
        times:
          type: array
          items:
            $ref: "#/components/schemas/Time"
        rating:
          type: number
          minimum: 0
          maximum: 5
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          properties:
            _id:
              type: string
            owner:
              type: object
              properties:
                email:
                  type: string
                full_name:
                  type: string
    IngredientInput:
      oneOf:
        - type: string
          description: A whole ingredient line, e.g. "1 1/2 cups flour, sifted".
        - $ref: "#/components/schemas/StructuredIngredient"
        - $ref: "#/components/schemas/IngredientGroup"
    StructuredIngredient:
      type: object
      description: |
        The preferred shape. `ingredient` is the name and prep only -- keep the
        amount and unit out of it.
      properties:
        ingredient:
          type: string
          description: Ingredient name and prep, e.g. "flour, sifted".
        amount:
          description: |
            A number, or a string we can parse ("1 1/2", "2-3", "two"). Omit for
            ingredients with no amount ("salt to taste").
          oneOf:
            - type: number
            - type: string
        unit:
          type: string
          description: e.g. "cups", "tbsp", "cloves".
        rangeAmount:
          type: number
          description: The other end of a range, if you would rather not write "2-3".
        altAmounts:
          $ref: "#/components/schemas/AltAmountsInput"
        shopItem:
          type: string
          description: |
            Optional. The bare item for a shopping list ("eggs" for "large
            eggs, beaten"). Omit it and the server fills it from the text. A
            shopItem you send is stored as is, so drop it (or send a new one)
            when you change an ingredient's text.
    AltAmountsInput:
      type: array
      description: |
        Optional. Further measures of the same quantity, e.g. `amount: 2,
        unit: "sticks"` with `altAmounts: [{"amount": 225, "unit": "g"}]`, which
        is shown as "2 sticks (225 g) butter". Each entry is an object like
        `amount` or a string like "225 g". Sending `[]` means "no further
        measures" and stops the server looking for one in the text.

        If you do not send it, the server looks for one in the ingredient text
        and, when a parenthetical (or a part after a slash) is a plain number
        and a mass, volume or stick unit, moves it here and out of the text:
        `{"amount": 285, "unit": "g", "ingredient": "butter (2 1/2 sticks)"}`
        is stored as text "butter" with altAmounts [2 1/2 sticks]. Anything
        else in parentheses ("(optional)", "(about 3 lemons)", "(14 oz can)")
        stays in the text. When the server moves one out, the original text is
        kept in `originalText`.
      items:
        oneOf:
          - type: string
          - $ref: "#/components/schemas/Amount"
    IngredientGroup:
      type: object
      description: A heading with its own sub-list, kept as a real sub-list.
      required:
        - ingredients
      properties:
        text:
          type: string
          description: The group heading, e.g. "FOR THE DOUGH:".
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientInput"
    Ingredient:
      type: object
      description: The canonical stored shape, as returned by GET requests.
      properties:
        text:
          type: string
          description: The ingredient name only, with amount and unit removed.
        ingkey:
          type: string
          description: |
            Older ingredients only: the bare item as the desktop app stored
            it. Same meaning as shopItem.
        shopItem:
          type: string
          description: |
            The bare item, lower case ("eggs", "butter", "diced tomatoes"):
            what a shopping list shows and merges on. Filled by the server on
            API writes when the client sent neither shopItem nor ingkey; older
            ingredients may have none.
        amount:
          $ref: "#/components/schemas/Amount"
        altAmounts:
          type: array
          description: |
            Present only when the ingredient has further measures of the same
            quantity. Each is shaped like `amount`; `amount` stays the primary.
          items:
            $ref: "#/components/schemas/Amount"
        originalText:
          type: string
          description: The line as first written, when the server parsed it.
        ingredients:
          type: array
          description: Present only on groups.
          items:
            $ref: "#/components/schemas/Ingredient"
    Amount:
      type: object
      properties:
        amount:
          type: number
          description: The upper bound when the ingredient is a range.
        rangeAmount:
          type: number
          description: The lower bound of a range; absent otherwise.
        unit:
          type: string
        standardUnit:
          type: string
          description: Our normalized unit, when we recognize it.
    TextBlock:
      type: object
      properties:
        header:
          type: string
          description: The block heading, e.g. "Instructions", "Dough". May be empty.
        body:
          type: string
          description: |
            Plain text or HTML, stored exactly as sent.

            Plain text: a blank line starts a new paragraph; lines starting
            "1." or "-" become a list; a short first line ending in ":" becomes
            a subheading.

            HTML: the app shows only these tags (others are removed and their
            text kept): p br h2 h3 h4 h5 h6 ol ul li b strong i em u a
            blockquote hr sub sup small span div table thead tbody tr th td img
            amount. Attributes kept: href title src alt colspan rowspan (no
            class, style, on* or data-*).

            Scalable amounts: wrap an ingredient quantity in `<amount>...</amount>`
            and the app multiplies it when the reader scales the recipe:
            `Beat in <amount>2</amount> eggs, then <amount>1 1/2 cups</amount>
            milk. Bake for 20 minutes.` reads "Beat in 4 eggs, then 3 cups milk.
            Bake for 20 minutes." at x2; the unwrapped 20 minutes never scales.
            Inside the tag: a number, fraction, mixed number or range ("2",
            "1/2", "1 1/2", "2-3", "2 to 3"), optionally followed by its unit
            ("200 g", "1 cup"). No attributes. Works in plain-text bodies too.
            Wrap only ingredient quantities, never times, temperatures, pan
            sizes or step numbers. Clients that do not know the tag show its
            text unchanged.
    Category:
      type: object
      properties:
        name:
          type: string
    Source:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
    Yield:
      type: object
      properties:
        amount:
          type: number
        unit:
          type: string
    Time:
      type: object
      properties:
        name:
          type: string
        seconds:
          type: number
        text:
          type: string
    Image:
      type: object
      properties:
        url:
          type: string
        caption:
          type: string
        width:
          type: number
